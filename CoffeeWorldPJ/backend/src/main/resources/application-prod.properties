# =============================================
# Perfil de PRODUCAO — Railway + Supabase
# =============================================

# Banco Supabase (variaveis definidas no Railway)
# SSL obrigatorio no Supabase — adicione ?sslmode=require na URL do Railway
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tabelas já criadas via migration no Supabase — só valida, não altera
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Seed já aplicado via migration — nao roda data.sql em producao
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# CORS — defina ALLOWED_ORIGINS no Railway com a URL publica do frontend
# Exemplo: https://frontend-production-xxxx.up.railway.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:80}

# Swagger desabilitado em producao
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# =============================================
# Profile PROD — TODAS as variaveis sensiveis SEM fallback.
# Se faltar alguma no Railway, o app NAO sobe (fail-fast e seguro).
# =============================================

# JWT — obrigatorio, gerado com: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Seed de usuarios — TODOS obrigatorios, nada hardcoded
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME}
app.cozinha.email=${COZINHA_EMAIL}
app.cozinha.password=${COZINHA_PASSWORD}
