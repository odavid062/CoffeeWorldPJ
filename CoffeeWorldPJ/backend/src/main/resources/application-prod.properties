# =============================================
# Perfil de PRODUCAO — Railway + Supabase
# =============================================

# Banco Supabase (variaveis definidas no Railway)
# SSL obrigatorio no Supabase — adicione ?sslmode=require na URL do Railway
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tabelas já criadas via migration no Supabase — só valida, não altera
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Seed já aplicado via migration — nao roda data.sql em producao
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Swagger disponivel em producao
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
