spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/coffe-world}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# CORS — em dev aceita localhost
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}

# JWT — chave em Base64 (256 bits). EM PRODUCAO defina JWT_SECRET no Railway.
